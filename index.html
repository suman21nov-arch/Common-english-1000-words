["Assumption","noun","something accepted as true without proof","অনুমান",["We made an assumption that everyone had read the report.","Don't base decisions on a wrong assumption."],"Very common in meetings: 'Let's not make assumptions'","Thinking"],

["Premise","noun","an assumption on which an argument is based","যুক্তির ভিত্তি",["The whole argument rests on a faulty premise.","Let us agree on the premise before we discuss further."],"Used in debates, presentations, and analysis","Thinking"],
["Ambiguity","noun","uncertainty of meaning","অস্পষ্টতা",["There is some ambiguity in the contract wording.","We need to remove the ambiguity from these instructions."],"Very common in legal, HR, and communication contexts","Thinking"],
["Dichotomy","noun","a division into two opposite groups","দ্বিভাজন",["There is a false dichotomy between quality and speed.","The dichotomy between work and life balance is real."],"Used when discussing two opposing ideas","Thinking"],

["Segmentation","noun","dividing data into meaningful groups","ডেটাকে অর্থবহ দলে ভাগ করা",["Workforce segmentation helps design targeted retention strategies.","She used segmentation to identify which roles had the highest flight risk."],"Common in HR analytics and marketing discussions","Data & Analytics"],
["Predictive analytics","phrase","using data to predict future outcomes","ভবিষ্যৎ ফলাফল পূর্বাভাসের জন্য ডেটা ব্যবহার",["Predictive analytics can identify employees at risk of leaving.","She invested in predictive analytics to improve workforce planning."],"Common in HR and business analytics","Data & Analytics"],

["Insight","noun","understanding revealed by data analysis","ডেটা বিশ্লেষণ দ্বারা প্রকাশিত বোঝাপড়া",["The survey data yielded some surprising insights about engagement.","She translates data into insights and then into action."],"Very common in business and analytical discussions","Data & Analytics"],

["Sample size","phrase","the number of observations in a dataset","একটি ডেটাসেটে পর্যবেক্ষণের সংখ্যা",["A sample size of twenty is too small to draw conclusions.","She ensured the sample size was large enough before reporting."],"Common in research and analytical discussions","Data & Analytics"],

["Data integrity","phrase","the accuracy and consistency of data","ডেটার নির্ভুলতা ও সামঞ্জস্যতা",["Data integrity is essential before drawing any conclusions.","She audits data integrity quarterly to maintain report accuracy."],"Common in data, IT, and management discussions","Data & Analytics"],
["Lag indicator","phrase","a metric that shows past performance","অতীত কর্মক্ষমতা দেখানো মেট্রিক",["Revenue is a lag indicator — it tells you what already happened.","She tracks lag indicators alongside lead indicators for a complete picture."],"Common in business, analytics, and performance discussions","Data & Analytics"],
["Lead indicator","phrase","a metric that predicts future performance","ভবিষ্যৎ কর্মক্ষমতা পূর্বাভাস দেওয়া মেট্রিক",["Employee satisfaction is a lead indicator of customer satisfaction.","She uses lead indicators to get ahead of problems before they emerge."],"Common in business, analytics, and performance discussions","Data & Analytics"],

["Concur","verb","to agree with someone","কারও সাথে একমত হওয়া",["I concur with your assessment of the situation.","She concurred with the recommendation but asked for more time."],"More formal and polished than 'I agree'","Meetings & Presentations"],
["Dissent","verb","to hold a different opinion","ভিন্ন মতামত পোষণ করা",["She dissented from the majority view and explained her reasons clearly.","It is healthy to dissent — silence is not the same as agreement."],"Common in meetings, governance, and professional discussions","Meetings & Presentations"],
["Defer","verb","to put off or yield to someone else","পিছিয়ে দেওয়া বা অন্যকে প্রাধান্য দেওয়া",["Let us defer this item to the next meeting.","I will defer to your expertise on the legal question."],"Very common in meetings and professional discussions","Meetings & Presentations"],

["Flag","verb","to bring something to attention","কিছুতে মনোযোগ আনা",["I wanted to flag an important risk before we proceed.","She flagged the compliance issue as soon as she noticed it."],"Very common in professional meetings and emails","Meetings & Presentations"],
["Revisit","verb","to consider something again at a later time","পরবর্তী সময়ে আবার বিবেচনা করা",["Let us revisit this decision in the next quarter.","She asked to revisit the policy after the pilot results were in."],"Very common in meetings and professional discussions","Meetings & Presentations"],
["Endorse","verb","to officially support or approve","আনুষ্ঠানিকভাবে সমর্থন বা অনুমোদন করা",["The committee endorsed the proposal with minor amendments.","She would not endorse the plan until the risks were addressed."],"Common in meetings, governance, and professional contexts","Meetings & Presentations"],
["Challenge","verb","to question the validity of something","কোনো কিছুর বৈধতা প্রশ্ন করা",["She challenged the assumption underlying the whole strategy.","Do not be afraid to challenge — that is what you are paid to do."],"Very common in professional meetings and discussions","Meetings & Presentations"],

["Brief","verb","to give someone a summary of information","কাউকে তথ্যের সারসংক্ষেপ দেওয়া",["She briefed the CEO before the board presentation.","Please brief the team on the new policy before it is announced."],"Very common in professional and management contexts","Meetings & Presentations"],

["Socialise","verb","to share an idea informally before a formal decision","আনুষ্ঠানিক সিদ্ধান্তের আগে অনানুষ্ঠানিকভাবে একটি ধারণা ভাগ করা",["She socialised the idea with key stakeholders before the board meeting.","Socialising a proposal first avoids surprises in the formal meeting."],"Very common in management and leadership discussions","Meetings & Presentations"],
["Escalate","verb","to raise something to a higher authority","উচ্চতর কর্তৃপক্ষের কাছে কিছু উত্থাপন করা",["If this is not resolved today, I will need to escalate to the director.","She escalated the complaint through the correct channels."],"Essential in professional and management contexts","Meetings & Presentations"],
["Alignment","noun","a state of agreement and common direction","মতৈক্য ও সাধারণ দিকনির্দেশনার অবস্থা",["We need alignment across all departments before we proceed.","She spent the first month getting alignment on the vision."],"Very common in business and leadership discussions","Meetings & Presentations"],
["Buy-in","noun","agreement and genuine support","সম্মতি ও প্রকৃত সমর্থন",["Without buy-in from operations, this will fail.","She spent two weeks getting buy-in before presenting to the board."],"Very common in management and leadership discussions","Meetings & Presentations"],
["Sign-off","noun","formal approval to proceed","এগিয়ে যাওয়ার আনুষ্ঠানিক অনুমোদন",["We are waiting for the finance director's sign-off.","She obtained sign-off before communicating the change."],"Very common in business and management contexts","Meetings & Presentations"],
["AOB","phrase","Any Other Business — agenda item for miscellaneous topics","বিবিধ বিষয়ের জন্য এজেন্ডা আইটেম",["Under AOB, she raised the upcoming office renovation.","Please save any new topics for AOB at the end of the meeting."],"Common in formal and semi-formal meeting contexts","Meetings & Presentations"],
["Action points","phrase","a list of tasks arising from a meeting","বৈঠক থেকে উদ্ভূত কাজের তালিকা",["She summarised the action points at the end of every meeting.","All action points were completed before the next meeting."],"Very common in professional meeting culture","Meetings & Presentations"],
["Pre-read","noun","material sent before a meeting for preparation","প্রস্তুতির জন্য বৈঠকের আগে পাঠানো উপকরণ",["Please review the pre-read before tomorrow's strategy session.","She sends a pre-read so the meeting focuses on discussion, not information."],"Common in management and professional meeting culture","Meetings & Presentations"],
["Straw man","phrase","a preliminary proposal meant for discussion","আলোচনার জন্য প্রাথমিক প্রস্তাব",["Here is a straw man proposal — please challenge and improve it.","She presented a straw man to provoke debate and get to the best answer."],"Common in strategy and professional meetings","Meetings & Presentations"],
["Devil's advocate","phrase","arguing the opposite side to test an idea","একটি ধারণা পরীক্ষা করতে বিপরীত পক্ষে যুক্তি দেওয়া",["Let me play devil's advocate — what if the opposite is true?","She asked someone to play devil's advocate before every major decision."],"Very common in meetings and strategic discussions","Meetings & Presentations"],

["Talking points","phrase","key messages prepared for a discussion","আলোচনার জন্য প্রস্তুত মূল বার্তা",["She prepared her talking points before the difficult conversation.","The CEO asked for talking points for the town hall."],"Very common in communication and leadership contexts","Meetings & Presentations"],
["Town hall","phrase","a large meeting where leadership addresses all staff","একটি বড় বৈঠক যেখানে নেতৃত্ব সব কর্মীদের সম্বোধন করেন",["She presented the new strategy at the quarterly town hall.","Town halls are a key tool for maintaining organisational alignment."],"Very common in corporate and management contexts","Meetings & Presentations"],
["Road show","phrase","a series of presentations to different audiences","বিভিন্ন দর্শকদের কাছে উপস্থাপনার একটি ধারাবাহিকতা",["She did a road show across four cities to present the new HR strategy.","A road show builds engagement and gives people a chance to ask questions."],"Common in business and management contexts","Meetings & Presentations"],
["Kickoff meeting","phrase","the first meeting to start a project","একটি প্রকল্প শুরু করতে প্রথম বৈঁঠক",["The project kickoff meeting set the tone for the whole initiative.","She ensures every project starts with a strong kickoff meeting."],"Very common in project management and business contexts","Meetings & Presentations"],
["Post-mortem","phrase","a review held after a project to learn from it","একটি প্রকল্পের পরে ধরে রাখা পর্যালোচনা",["The post-mortem revealed three key lessons for future projects.","She insists on a post-mortem after every major initiative."],"Common in project management and management discussions","Meetings & Presentations"],

// ── WORDS FOR WRITTEN COMMUNICATION (20) ──
["Concise","adj","brief and clear with no unnecessary words","অপ্রয়োজনীয় শব্দ ছাড়া সংক্ষিপ্ত ও স্পষ্ট",["Keep your emails concise — senior leaders do not have time to read long messages.","She is known for her concise and powerful writing style."],"One of the most valued qualities in professional writing","Written Communication"],
["Succinct","adj","briefly and clearly expressed","সংক্ষিপ্তভাবে ও স্পষ্টভাবে প্রকাশিত",["His report was succinct — two pages covering everything that mattered.","Be succinct in your executive summary — no more than five sentences."],"Very common and impressive in professional writing contexts","Written Communication"],
["Articulate","adj","expressed clearly and effectively","স্পষ্টভাবে ও কার্যকরভাবে প্রকাশিত",["Her written communication is consistently clear and articulate.","An articulate response builds credibility with senior leadership."],"One of the most valued professional communication qualities","Written Communication"],
["Lucid","adj","expressed clearly and easily understood","স্পষ্টভাবে প্রকাশিত ও সহজে বোঝা যায়",["Her analysis was lucid — even the most complex ideas were easy to follow.","A lucid explanation is more valuable than a technically perfect one."],"Common in professional and academic discussions","Written Communication"],
["Coherent","adj","logical and internally consistent","যৌক্তিক ও অভ্যন্তরীণভাবে সামঞ্জস্যপূর্ণ",["The proposal needs to be more coherent before it goes to the board.","She rewrote the report until it was fully coherent."],"Very common in professional writing and communication","Written Communication"],
["Compelling","adj","strongly interesting and persuasive","দৃঢ়ভাবে আকর্ষণীয় ও বিশ্বাসযোগ্য",["She wrote a compelling business case that was approved immediately.","A compelling argument combines logic, evidence, and emotion."],"Very common in professional communication contexts","Written Communication"],
["Nuanced","adj","taking into account subtle differences","সূক্ষ্ম পার্থক্য বিবেচনা করা",["Her response was nuanced and showed she had considered all perspectives.","Nuanced communication avoids oversimplification."],"Common in professional and analytical communications","Written Communication"],
["Proofread","verb","to check written work for errors","লিখিত কাজ ত্রুটির জন্য পরীক্ষা করা",["Always proofread before sending any formal communication.","She proofread the policy document three times before publishing."],"Essential in professional writing contexts","Written Communication"],
["Annotate","verb","to add notes to a document","একটি দলিলে নোট যোগ করা",["She annotated the contract with her questions for the lawyer.","Annotated documents help track decisions and reasoning."],"Common in professional and legal contexts","Written Communication"],
["Draft","verb","to prepare a first version of a document","একটি দলিলের প্রথম সংস্করণ প্রস্তুত করা",["She drafted the new leave policy over the weekend.","Please draft a response for my review before sending."],"Very common in professional and management contexts","Written Communication"],
["Redraft","verb","to rewrite a document after feedback","প্রতিক্রিয়ার পরে একটি দলিল পুনরায় লেখা",["She redrafted the report after receiving comments from the director.","The policy was redrafted three times before it was approved."],"Common in professional and management contexts","Written Communication"],
["Circulate","verb","to send a document to a group for comment","মন্তব্যের জন্য একটি দলের কাছে একটি দলিল পাঠানো",["Please circulate the draft policy for feedback by Friday.","She circulated the minutes within twenty-four hours of the meeting."],"Very common in professional communication contexts","Written Communication"],
["Acknowledge","verb","to confirm receipt of something","কিছু পাওয়ার নিশ্চয়তা দেওয়া",["Please acknowledge receipt of this email.","She acknowledged every complaint within forty-eight hours."],"Very common in professional email and communication","Written Communication"],

const W=[...W1,...W2,...W3,...W4,...W5,...W6,...W6_EXTRA];

// ── STATE ──
const TOTAL=W.length,BATCH=25;
const CATS=["All",...new Set(W.map(w=>w[6]))];
const KEY='suman_english_1000_v1';
let ST={learned:{},activeCat:"All",activeDay:0,streak:0,lastStudied:null,studyDays:[]};

function load(){try{const s=localStorage.getItem(KEY);if(s)ST=Object.assign(ST,JSON.parse(s));}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST));showToast();}catch(e){}}
function showToast(){const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500);}
function lc(){return Object.keys(ST.learned).filter(k=>ST.learned[k]).length;}

function updateStreak(){
  const today=new Date().toDateString();
  if(ST.lastStudied===today)return;
  const yest=new Date(Date.now()-86400000).toDateString();
  ST.streak=ST.lastStudied===yest?(ST.streak||0)+1:1;
  ST.lastStudied=today;
  if(!ST.studyDays)ST.studyDays=[];
  if(!ST.studyDays.includes(today))ST.studyDays.push(today);
}

function topBar(){
  const n=lc(),p=Math.round(n/TOTAL*100),left=TOTAL-n,d=Math.ceil(left/25);
  document.getElementById('pf').style.width=p+'%';
  document.getElementById('s-l').textContent=n;
  document.getElementById('s-r').textContent=left;
  document.getElementById('s-p').textContent=p+'%';
  document.getElementById('s-d').textContent=d;
  document.getElementById('streak-badge').textContent='🔥 '+(ST.streak||0)+' days';
}

function go(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  if(name==='quiz')startQuiz();
  if(name==='progress')renderProgress();
  window.scrollTo(0,0);
}

function fw(){return ST.activeCat==='All'?W:W.filter(w=>w[6]===ST.activeCat);}

function buildCats(){
  const c=document.getElementById('cats');c.innerHTML='';
  CATS.forEach(cat=>{
    const b=document.createElement('button');
    b.className='pill'+(cat===ST.activeCat?' active':'');
    b.textContent=cat;
    b.onclick=()=>{ST.activeCat=cat;ST.activeDay=0;buildCats();buildDayTabs();render();};
    c.appendChild(b);
  });
}

function buildDayTabs(){
  const f=fw(),batches=Math.ceil(f.length/BATCH);
  const c=document.getElementById('day-tabs');c.innerHTML='';
  for(let i=0;i<batches;i++){
    const b=document.createElement('button');
    b.className='pill green'+(i===ST.activeDay?' active':'');
    b.textContent='Day '+(i+1);
    b.onclick=()=>{ST.activeDay=i;buildDayTabs();render();window.scrollTo(0,0);};
    c.appendChild(b);
  }
  setTimeout(()=>{const a=document.querySelector('#day-tabs .pill.active');if(a)a.scrollIntoView({inline:'center',block:'nearest'});},50);
}

function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.getElementById('filt').value;
  let items;
  if(q){items=W.filter(w=>w[0].toLowerCase().includes(q)||w[2].toLowerCase().includes(q)||w[3].includes(q));}
  else{const base=fw(),s=ST.activeDay*BATCH,e=Math.min(s+BATCH,base.length);items=base.slice(s,e);}
  if(f==='done')items=items.filter(w=>ST.learned[W.indexOf(w)]);
  if(f==='undone')items=items.filter(w=>!ST.learned[W.indexOf(w)]);
  const out=items.map(w=>{
    const i=W.indexOf(w),done=!!ST.learned[i];
    return`<div class="card${done?' done':''}" onclick="tog(${i})">
      <div class="card-top">
        <div class="card-left">
          <div class="word">${w[0]}</div>
          <div class="badges"><span class="badge b-type">${w[1]}</span><span class="badge b-cat">${w[6]}</span></div>
          <div class="mean-en">${w[2]}</div>
          <div class="mean-bn">${w[3]}</div>
        </div>
        <div class="tick">${done?'✓':''}</div>
      </div>
      <div class="examples">
        <div class="ex">${w[4][0]}</div>
        <div class="ex">${w[4][1]}</div>
        ${w[5]?'<div class="tip">💡 '+w[5]+'</div>':''}
      </div>
    </div>`;
  });
  document.getElementById('word-list').innerHTML=out.length?out.join(''):'<div class="empty">No words found.</div>';
}

function tog(i){
  ST.learned[i]=!ST.learned[i];
  updateStreak();save();topBar();render();
}

// ── QUIZ ──
let quiz={words:[],idx:0,score:0,answered:false};
function startQuiz(){
  const pool=W.filter((_,i)=>ST.learned[i]);
  if(pool.length<4){
    document.getElementById('quiz-wrap').innerHTML='<div class="qcard"><div class="qdone"><h2>Not enough words yet</h2><p>Learn at least 4 words first!</p><button class="qrestart" onclick="go(\'learn\')">Go Learn →</button></div></div>';
    return;
  }
  const shuffled=[...pool].sort(()=>Math.random()-0.5).slice(0,Math.min(10,pool.length));
  quiz={words:shuffled,idx:0,score:0,answered:false};
  renderQuiz();
}
function renderQuiz(){
  if(quiz.idx>=quiz.words.length){
    const pct=Math.round(quiz.score/quiz.words.length*100),e=pct>=80?'🎉':pct>=60?'👍':'💪';
    document.getElementById('quiz-wrap').innerHTML=`<div class="qcard"><div class="qdone"><h2>${e} Quiz Done!</h2><p>You scored <b>${quiz.score}/${quiz.words.length}</b> (${pct}%)</p><button class="qrestart" onclick="startQuiz()">Try Again</button></div></div>`;
    return;
  }
  const w=quiz.words[quiz.idx];
  const pool=W.filter((_,i)=>ST.learned[i]&&W[i]!==w);
  const wrongs=[...pool].sort(()=>Math.random()-0.5).slice(0,3).map(x=>x[2]);
  const opts=[w[2],...wrongs].sort(()=>Math.random()-0.5);
  document.getElementById('quiz-wrap').innerHTML=`<div class="qcard">
    <div class="qhdr"><span class="qnum">Q ${quiz.idx+1}/${quiz.words.length}</span><span class="qscr">Score: ${quiz.score}</span></div>
    <div class="qq">${w[0]}</div>
    <div class="qsub">What does this mean in English?</div>
    <div class="qopts">${opts.map((o,i)=>`<button class="qopt" onclick="ans(${i},'${o.replace(/'/g,"\\'")}','${w[2].replace(/'/g,"\\'")}',${JSON.stringify(opts)})">${o}</button>`).join('')}</div>
  </div>`;
}
function ans(idx,chosen,correct,opts){
  if(quiz.answered)return;
  quiz.answered=true;
  document.querySelectorAll('.qopt').forEach((b,i)=>{
    if(opts[i]===correct)b.classList.add('correct');
    else if(i===idx&&chosen!==correct)b.classList.add('wrong');
    else b.classList.add('reveal');
    b.onclick=null;
  });
  if(chosen===correct)quiz.score++;
  const nxt=document.createElement('button');
  nxt.className='qnxt';
  nxt.textContent=quiz.idx+1<quiz.words.length?'Next →':'See Results';
  nxt.onclick=()=>{quiz.idx++;quiz.answered=false;renderQuiz();};
  document.querySelector('.qcard').appendChild(nxt);
}

// ── PROGRESS ──
function renderProgress(){
  const n=lc(),p=Math.round(n/TOTAL*100);
  const colors=['#38bdf8','#22c55e','#f59e0b','#a78bfa','#f87171','#34d399','#fb923c','#818cf8','#4ade80','#fbbf24','#60a5fa','#f472b6','#2dd4bf','#e879f9','#94a3b8','#38bdf8','#22c55e','#f59e0b','#a78bfa','#f87171'];
  const catData=CATS.filter(c=>c!=='All').map((c,ci)=>{
    const cw=W.filter(w=>w[6]===c),cl=cw.filter(w=>ST.learned[W.indexOf(w)]).length;
    return{name:c,total:cw.length,learned:cl,pct:Math.round(cl/cw.length*100),color:colors[ci%colors.length]};
  });
  const days28=[];
  for(let i=27;i>=0;i--){const d=new Date(Date.now()-i*86400000).toDateString();days28.push({date:d,on:(ST.studyDays||[]).includes(d),today:i===0});}
  const milestones=[
    {n:50,icon:'⭐',title:'Getting Started',sub:'Learn 50 words'},
    {n:150,icon:'🔥',title:'On a Roll',sub:'Learn 150 words'},
    {n:300,icon:'💪',title:'Halfway Hero',sub:'Learn 300 words'},
    {n:500,icon:'🚀',title:'Advanced Learner',sub:'Learn 500 words'},
    {n:750,icon:'🏆',title:'Near the Top',sub:'Learn 750 words'},
    {n:1000,icon:'👑',title:'Master Speaker',sub:'Learn all 1000 words'}
  ];
  document.getElementById('prog-screen').innerHTML=`
    <div class="pcard"><h3>Overall Progress</h3>
      <div class="big-num">${p}%</div>
      <div class="big-sub">${n} of ${TOTAL} words learned</div>
      <div style="margin-top:12px"><div class="pbar"><div class="pbar-fill" style="width:${p}%;background:#22c55e"></div></div></div>
    </div>
    <div class="pcard"><h3>By Category</h3>
      ${catData.map(c=>`<div class="pbar-row">
        <div class="pbar-lbl"><span>${c.name}</span><span>${c.learned}/${c.total}</span></div>
        <div class="pbar"><div class="pbar-fill" style="width:${c.pct}%;background:${c.color}"></div></div>
      </div>`).join('')}
    </div>
    <div class="pcard"><h3>Study Activity (Last 28 Days)</h3>
      <div class="cal-grid">${days28.map(d=>`<div class="cal-day${d.on?' on':''}${d.today?' today':''}"></div>`).join('')}</div>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:#64748b;margin-top:4px"><span>4w ago</span><span>3w ago</span><span>2w ago</span><span>1w ago</span><span>Today</span></div>
    </div>
    <div class="pcard"><h3>Milestones</h3>
      ${milestones.map(m=>`<div class="ms">
        <div class="ms-icon">${m.icon}</div>
        <div class="ms-txt"><div class="ms-title">${m.title}</div><div class="ms-sub">${m.sub}</div></div>
        <span class="ms-bdg ${n>=m.n?'bdg-done':'bdg-pend'}">${n>=m.n?'✅ Done':(m.n-n)+' left'}</span>
      </div>`).join('')}
    </div>
    <div class="pcard"><h3>Your Stats</h3>
      <div class="ms"><div class="ms-icon">🔥</div><div class="ms-txt"><div class="ms-title">Current Streak</div><div class="ms-sub">Consecutive days</div></div><span class="ms-bdg bdg-done">${ST.streak||0} days</span></div>
      <div class="ms"><div class="ms-icon">📅</div><div class="ms-txt"><div class="ms-title">Total Study Days</div><div class="ms-sub">Days you studied</div></div><span class="ms-bdg bdg-done">${(ST.studyDays||[]).length}</span></div>
      <div class="ms"><div class="ms-icon">⏳</div><div class="ms-txt"><div class="ms-title">Days to Finish</div><div class="ms-sub">At 25 words per day</div></div><span class="ms-bdg bdg-pend">${Math.ceil((TOTAL-n)/25)} days</span></div>
    </div>`;
}

// ── INIT ──
load();buildCats();buildDayTabs();topBar();render();updateStreak();
</script>
