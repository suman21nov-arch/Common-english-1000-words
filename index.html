<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Suman's English Word Trainer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;font-size:15px;min-height:100vh}
.topbar{background:#1e293b;padding:12px 16px 10px;position:sticky;top:0;z-index:200;border-bottom:1px solid #334155}
.topbar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.topbar h1{font-size:14px;font-weight:700;color:#f1f5f9}
.streak{background:#f59e0b;color:#000;font-size:11px;font-weight:700;border-radius:20px;padding:3px 9px}
.prog-wrap{background:#334155;border-radius:99px;height:5px;margin-bottom:7px}
.prog-fill{height:100%;background:#22c55e;border-radius:99px;transition:width 0.5s}
.stats-row{display:flex;justify-content:space-between}
.stat{text-align:center}
.stat-val{font-size:14px;font-weight:700;color:#fff}
.stat-lbl{font-size:10px;color:#94a3b8}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#1e293b;border-top:1px solid #334155;display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom)}
.bnav-btn{flex:1;padding:10px 4px 8px;text-align:center;cursor:pointer;font-size:10px;color:#64748b;font-weight:600;border:none;background:none}
.bnav-btn.active{color:#38bdf8}
.bnav-icon{font-size:20px;display:block;margin-bottom:2px}
.screen{display:none;padding-bottom:80px}
.screen.active{display:block}
.sbar{background:#1e293b;border-bottom:1px solid #334155;overflow-x:auto;white-space:nowrap;padding:9px 12px}
.sbar::-webkit-scrollbar{display:none}
.pill{display:inline-block;padding:5px 12px;margin-right:6px;border-radius:20px;border:1.5px solid #334155;font-size:11px;font-weight:600;cursor:pointer;background:#0f172a;color:#64748b;user-select:none}
.pill.active{background:#38bdf8;color:#0f172a;border-color:#38bdf8}
.pill.g.active{background:#22c55e;border-color:#22c55e;color:#000}
.ctrl{padding:8px 12px;background:#1e293b;border-bottom:1px solid #334155;display:flex;gap:8px}
.ctrl input{flex:1;padding:7px 12px;border:1.5px solid #334155;border-radius:20px;font-size:13px;outline:none;background:#0f172a;color:#f1f5f9}
.ctrl select{padding:7px 9px;border:1.5px solid #334155;border-radius:20px;font-size:12px;background:#0f172a;outline:none;color:#f1f5f9;font-weight:500}
.wlist{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
/* CARD */
.card{background:#1e293b;border-radius:16px;padding:14px;border:2px solid #334155;cursor:pointer;transition:all 0.2s}
.card.done{border-color:#22c55e;background:#0d2818}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-left{flex:1;min-width:0}
.word{font-size:17px;font-weight:700;color:#f1f5f9;letter-spacing:-0.3px}
.wtype{font-size:10px;font-weight:600;background:#1e3a5f;color:#93c5fd;border-radius:6px;padding:2px 7px;display:inline-block;margin-top:4px}
.wcat{font-size:10px;font-weight:600;background:#1e2d3d;color:#38bdf8;border-radius:6px;padding:2px 7px;display:inline-block;margin-top:4px;margin-left:4px}
/* MEANINGS — NEW multi-meaning design */
.meanings{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.meaning-block{background:#0f172a;border-radius:10px;padding:8px 10px;border-left:3px solid #38bdf8}
.meaning-block.m2{border-left-color:#a78bfa}
.m-num{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px}
.m-en{font-size:13px;color:#cbd5e1;line-height:1.5}
.m-bn{font-size:12px;color:#38bdf8;font-weight:600;margin-top:2px}
.m-bn.m2{color:#a78bfa}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid #475569;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;color:transparent;transition:all 0.2s;margin-top:2px}
.card.done .tick{background:#22c55e;border-color:#22c55e;color:#000;font-weight:700}
.examples{margin-top:9px;padding-top:9px;border-top:1px solid #334155;display:flex;flex-direction:column;gap:6px}
.ex-block{display:flex;gap:8px;align-items:flex-start}
.ex-label{font-size:10px;font-weight:700;color:#64748b;background:#1e293b;border:1px solid #334155;border-radius:4px;padding:1px 5px;flex-shrink:0;margin-top:2px}
.ex{font-size:12px;color:#94a3b8;line-height:1.6}
.tip{font-size:11px;color:#f59e0b;margin-top:6px;padding:6px 10px;background:#1c1a00;border-radius:8px;line-height:1.5}
.empty{text-align:center;color:#475569;padding:40px 20px;font-size:14px}
/* QUIZ */
.qwrap{padding:14px 12px;padding-bottom:80px}
.qcard{background:#1e293b;border-radius:18px;padding:18px;margin-bottom:10px}
.qhdr{display:flex;justify-content:space-between;margin-bottom:14px}
.qnum{font-size:12px;color:#64748b}
.qscr{font-size:12px;font-weight:700;color:#22c55e}
.qq{font-size:18px;font-weight:700;color:#f1f5f9;margin-bottom:3px}
.qsub{font-size:12px;color:#64748b;margin-bottom:16px}
.qopts{display:flex;flex-direction:column;gap:9px}
.qopt{padding:13px 15px;border-radius:12px;border:2px solid #334155;font-size:13px;cursor:pointer;background:#0f172a;color:#f1f5f9;text-align:left;font-family:inherit}
.qopt.correct{border-color:#22c55e;background:#0d2818;color:#4ade80;font-weight:600}
.qopt.wrong{border-color:#ef4444;background:#2d0a0a;color:#fca5a5}
.qopt.reveal{opacity:0.35;border-color:#334155}
.qnxt{width:100%;padding:13px;border-radius:12px;background:#38bdf8;color:#0f172a;font-size:15px;font-weight:700;border:none;margin-top:10px;cursor:pointer;font-family:inherit}
.qdone{text-align:center;padding:28px 16px}
.qdone h2{font-size:22px;font-weight:700;margin-bottom:8px}
.qdone p{font-size:14px;color:#94a3b8;margin-bottom:18px}
.qres{padding:13px 26px;border-radius:12px;background:#38bdf8;color:#0f172a;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:inherit}
/* PROGRESS */
.pgwrap{padding:14px 12px;padding-bottom:80px}
.pcard{background:#1e293b;border-radius:16px;padding:15px;margin-bottom:10px}
.pcard h3{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px}
.bignum{font-size:44px;font-weight:700;color:#38bdf8;line-height:1}
.bigsub{font-size:13px;color:#64748b;margin-top:3px}
.pbr{margin-bottom:10px}
.pbl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.pbl span:first-child{color:#f1f5f9;font-weight:500}
.pbl span:last-child{color:#64748b}
.pb{background:#0f172a;border-radius:99px;height:8px;overflow:hidden}
.pbf{height:100%;border-radius:99px;transition:width 0.5s}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cd{aspect-ratio:1;border-radius:4px;background:#0f172a}
.cd.on{background:#22c55e}
.cd.today{outline:2px solid #38bdf8;outline-offset:1px}
.ms{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #334155}
.ms:last-child{border-bottom:none}
.msi{font-size:22px;width:36px;text-align:center}
.mst{flex:1}
.mstit{font-size:13px;font-weight:600;color:#f1f5f9}
.mssub{font-size:11px;color:#64748b;margin-top:1px}
.msb{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.bdon{background:#0d2818;color:#4ade80}
.bpnd{background:#1e293b;color:#64748b;border:1px solid #334155}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#22c55e;color:#000;font-size:12px;font-weight:700;padding:7px 18px;border-radius:99px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="toast" id="toast">✓ Saved</div>
<div class="topbar">
  <div class="topbar-row">
    <h1>📖 English Word Trainer</h1>
    <div class="streak" id="sbdg">🔥 0 days</div>
  </div>
  <div class="prog-wrap"><div class="prog-fill" id="pf" style="width:0%"></div></div>
  <div class="stats-row">
    <div class="stat"><div class="stat-val" id="sl">0</div><div class="stat-lbl">Learned</div></div>
    <div class="stat"><div class="stat-val" id="sr">–</div><div class="stat-lbl">Remaining</div></div>
    <div class="stat"><div class="stat-val" id="sp">0%</div><div class="stat-lbl">Done</div></div>
    <div class="stat"><div class="stat-val" id="sd">–</div><div class="stat-lbl">Days Left</div></div>
  </div>
</div>
<div class="bnav">
  <button class="bnav-btn active" id="nav-learn" onclick="go('learn')"><span class="bnav-icon">📚</span>Learn</button>
  <button class="bnav-btn" id="nav-quiz" onclick="go('quiz')"><span class="bnav-icon">🧠</span>Quiz</button>
  <button class="bnav-btn" id="nav-progress" onclick="go('progress')"><span class="bnav-icon">📈</span>Progress</button>
</div>
<div class="screen active" id="screen-learn">
  <div class="sbar" id="cats" style="position:sticky;top:105px;z-index:190"></div>
  <div class="sbar" id="dtabs" style="position:sticky;top:146px;z-index:189"></div>
  <div class="ctrl" style="position:sticky;top:187px;z-index:188">
    <input id="srch" type="text" placeholder="🔍 Search word or meaning..." oninput="render()">
    <select id="flt" onchange="render()">
      <option value="all">All</option>
      <option value="done">✅ Learned</option>
      <option value="undone">📖 To Learn</option>
    </select>
  </div>
  <div style="height:8px"></div>
  <div class="wlist" id="wlist"></div>
</div>
<div class="screen" id="screen-quiz"><div class="qwrap" id="qwrap"></div></div>
<div class="screen" id="screen-progress"><div class="pgwrap" id="pgwrap"></div></div>

<script>
const W=[["Assumption","noun",["something accepted as true without proof","a task or responsibility taken on willingly"],["অনুমান — প্রমাণ ছাড়াই সত্য বলে ধরে নেওয়া","দায়িত্ব গ্রহণ — ক্ষমতা বা দায়িত্ব নেওয়া"],["We made an assumption that everyone had read the report.","She made the assumption of the director role during the transition."],"Say: 'Let's not make assumptions' — very common in meetings","Thinking"],["Implication","noun",["a conclusion that can be drawn from something","a consequence or effect of an action"],["পরিণতি — কোনো কিছু থেকে বের হওয়া অর্থ","প্রভাব — কোনো কাজের ফলাফল বা প্রভাব"],["The implication of this data is that we need to change strategy.","The implications of this decision for the team are serious."],"Use 'implications' (plural) when talking about consequences","Thinking"],["Perspective","noun",["a particular point of view or way of thinking","the ability to think about things in a balanced way"],["দৃষ্টিভঙ্গি — কোনো বিষয়ে দেখার বিশেষ দৃষ্টিকোণ","ভারসাম্যপূর্ণ দৃষ্টিভঙ্গি — সব দিক বিবেচনা করার ক্ষমতা"],["From a financial perspective, this is a risky move.","Try to keep perspective — this is not as bad as it seems."],"'From a X perspective' is very common in professional speech","Thinking"],["Threshold","noun",["the level or point at which something begins","the strip at the bottom of a doorway (literal)"],["সীমামাত্রা — যে মাত্রায় কিছু শুরু হয়","দোরগোড়া — দরজার নিচের পাটি"],["We have not crossed the threshold for escalation yet.","Her pain threshold is very high — she never complains."],"Most commonly used in the figurative sense in business","Thinking"],["Nuance","noun",["a subtle difference in meaning or expression","a slight variation in tone, colour, or feeling"],["সূক্ষ্ম পার্থক্য — অর্থে সূক্ষ্ম তফাত","হালকা তারতম্য — রং বা অনুভূতিতে সামান্য পার্থক্য"],["There is a nuance between being assertive and being aggressive.","The nuances of her tone suggested she was not fully convinced."],"Native speakers use this constantly — it signals educated thinking","Thinking"],["Criteria","noun",["the standards or rules by which something is judged","the requirements that must be met"],["মানদণ্ড — বিচারের জন্য নিয়ম বা মান","শর্ত — যা পূরণ করতে হবে"],["What are the criteria for selecting candidates for this role?","She met all the criteria for the promotion this year."],"Always plural — one 'criterion', two 'criteria'","Thinking"],["Rationale","noun",["the reasons or logic behind a decision","a set of reasons given to justify a course of action"],["যুক্তি — সিদ্ধান্তের পেছনের কারণ","ন্যায্যতা — কোনো পদক্ষেপের কারণ"],["Can you explain the rationale behind this decision?","The rationale for the new policy is clearly stated in the document."],"Ask 'What is the rationale?' instead of 'Why?' in formal settings","Thinking"],["Premise","noun",["an assumption or starting point for an argument","a statement that is taken to be true as the basis of reasoning"],["যুক্তির ভিত্তি — বিতর্কের শুরুর ধারণা","পূর্বধারণা — যুক্তির বিন্দু হিসেবে গৃহীত বিবৃতি"],["The whole argument rests on a faulty premise.","Let us agree on the premise before we discuss further."],"'False premise' is a very common phrase in analytical discussions","Thinking"],["Ambiguity","noun",["uncertainty or inexactness of meaning","a word or statement that can be interpreted in more than one way"],["অস্পষ্টতা — অর্থের অনিশ্চয়তা","দ্ব্যর্থবোধকতা — একাধিক অর্থ থাকা"],["There is ambiguity in the contract wording that we must resolve.","His answer was full of ambiguity — nobody knew what he meant."],"'Remove the ambiguity' is a common professional phrase","Thinking"],["Paradox","noun",["a statement that seems contradictory but may be true","a person or thing that combines contradictory features"],["বিরোধাভাস — বিরোধী কিন্তু সত্য বক্তব্য","স্ববিরোধী সত্তা — বিরোধী গুণ একত্রে"],["The paradox is that more choices actually make us less happy.","She is a paradox — deeply introverted yet an outstanding presenter."],"Signals sophisticated thinking in any discussion","Thinking"],["Correlation","noun",["a mutual relationship between two things","the process of finding relationships between data"],["সম্পর্ক — দুটি বিষয়ের মধ্যে পারস্পরিক সম্পর্ক","তথ্য সম্পর্ক — ডেটার মধ্যে সম্পর্ক খোঁজা"],["There is a strong correlation between manager quality and retention.","The research found a correlation between sleep and productivity."],"Always pair with 'causation' — 'correlation does not mean causation'","Thinking"],["Discrepancy","noun",["a difference between things that should be the same","a lack of compatibility between facts or figures"],["পার্থক্য — যা মিলানোর কথা তার মধ্যে তফাত","অসঙ্গতি — তথ্যের মধ্যে বেমানানতা"],["There is a discrepancy between the two reports that needs investigation.","The auditor flagged a discrepancy in the expense claims."],"Very common in audits, finance, and HR investigations","Thinking"],["Scope","noun",["the range or extent of something","the opportunity or possibility to do something"],["পরিধি — কোনো কিছুর বিস্তার বা সীমা","সুযোগ — কিছু করার সম্ভাবনা"],["This issue is outside the scope of our project.","There is significant scope for improvement in our onboarding process."],"'Scope creep' means a project growing beyond its original boundaries","Thinking"],["Framework","noun",["a basic structure for understanding or doing something","a system of rules or principles"],["কাঠামো — বোঝা বা করার মৌলিক কাঠামো","নিয়মের কাঠামো — নীতির সমষ্টি"],["We need a framework for evaluating employee performance consistently.","The legal framework for data protection has changed significantly."],"'Framework' sounds more professional than 'system' or 'structure'","Thinking"],["Methodology","noun",["a system of methods used in a particular area","the study of methods used in a field"],["পদ্ধতি — কোনো ক্ষেত্রে ব্যবহৃত পদ্ধতির সমষ্টি","পদ্ধতি বিজ্ঞান — কোনো ক্ষেত্রের পদ্ধতির অধ্যয়ন"],["What methodology did you use for this research study?","Our recruitment methodology is based on competency-based interviewing."],"Mor gy contexts","Technology"],["Integration","noun",["connecting different systems to work together"],["ভিন্ন সিস্টেমকে একসাথে কাজ করার জন্য সংযুক্ত করা"],["The payroll system needs better integration with the attendance module.","She managed the integration of three legacy systems into one platform."],"Very common in technology and business discussions","Technology"],["User adoption","phrase",["how readily people start using a new system"],["মানুষ কত সহজে নতুন সিস্টেম ব্যবহার শুরু করে"],["User adoption of the new HRMS has been slower than expected.","She designed a change management plan to drive user adoption."],"Common in technology and change management contexts","Technology"],["Agile methodology","phrase",["a flexible, iterative approach to project delivery"],["প্রকল্প প্রদানের নমনীয়, পুনরাবৃত্তিমূলক পদ্ধতি"],["She adopted agile methodology to manage the HRMS implementation.","Agile methodology allows teams to adapt quickly to changing requirements."],"Very common in project management and technology","Technology"],["Digitise","verb",["to convert paper-based processes to digital"],["কাগজ-ভিত্তিক প্রক্রিয়া ডিজিটালে রূপান্তর করা"],["She digitised all HR records in her first year.","Digitising the onboarding process saved three hours per new hire."],"Very common in HR and business discussions","Technology"],["Artificial intelligence","phrase",["technology simulating human intelligence"],["মানুষের বুদ্ধিমত্তা অনুকরণকারী প্রযুক্তি"],["AI is transforming how we screen candidates.","She explored AI tools to improve the accuracy of psychometric assessments."],"Very common in modern business and HR discussions","Technology"],["Remote working tools","phrase",["technology enabling work from anywhere"],["যেকোনো জায়গা থেকে কাজ সক্ষম করার প্রযুক্তি"],["She ensured all staff had the right remote working tools before lockdown.","Investing in remote working tools improves productivity and flexibility."],"Very common in modern HR and workplace discussions","Technology"],["Data protection","phrase",["ensuring personal data is secure"],["ব্যক্তিগত ডেটা নিরাপদ রাখা"],["Data protection is a legal obligation under DPDPA 2023.","She trained all HR staff on data protection best practices."],"Very common in HR, legal, and compliance contexts","Technology"],["Concur","verb",["to agree with someone"],["কারও সাথে একমত হওয়া"],["I concur with your assessment of the situation.","She concurred with the recommendation but asked for more time."],"More formal and polished than 'I agree'","Meetings & Presentations"],["Dissent","verb",["to hold a different opinion"],["ভিন্ন মতামত পোষণ করা"],["She dissented from the majority view and explained her reasons clearly.","It is healthy to dissent — silence is not the same as agreement."],"Common in meetings, governance, and professional discussions","Meetings & Presentations"],["Table","verb",["to present something for discussion (UK) / to postpone (US)"],["আলোচনার জন্য উপস্থাপন করা"],["She tabled the proposal at the board meeting.","Can we table this item and return to it next month?"],"Very common — note the different meanings in UK and US English","Meetings & Presentations"],["Flag","verb",["to bring something to attention"],["কিছুতে মনোযোগ আনা"],["I wanted to flag an important risk before we proceed.","She flagged the compliance issue as soon as she noticed it."],"Very common in professional meetings and emails","Meetings & Presentations"],["Revisit","verb",["to consider something again at a later time"],["পরবর্তী সময়ে আবার বিবেচনা করা"],["Let us revisit this decision in the next quarter.","She asked to revisit the policy after the pilot results were in."],"Very common in meetings and professional discussions","Meetings & Presentations"],["Endorse","verb",["to officially support or approve"],["আনুষ্ঠানিকভাবে সমর্থন বা অনুমোদন করা"],["The committee endorsed the proposal with minor amendments.","She would not endorse the plan until the risks were addressed."],"Common in meetings, governance, and professional contexts","Meetings & Presentations"],["Challenge","verb",["to question the validity of something"],["কোনো কিছুর বৈধতা প্রশ্ন করা"],["She challenged the assumption underlying the whole strategy.","Do not be afraid to challenge — that is what you are paid to do."],"Very common in professional meetings and discussions","Meetings & Presentations"],["Caveat","verb",["to add a qualification or warning"],["একটি যোগ্যতা বা সতর্কতা যোগ করা"],["I support the proposal but want to caveat my agreement.","She caveated her response, noting that conditions could change."],"Very common in professional meetings and discussions","Meetings & Presentations"],["Circulate","verb",["to send something to a group of people"],["একটি দলের কাছে কিছু পাঠানো"],["Please circulate the minutes before end of day.","She circulated the agenda forty-eight hours before the meeting."],"Very common in professional and management contexts","Meetings & Presentations"],["Brief","verb",["to give someone a summary of information"],["কাউকে তথ্যের সারসংক্ষেপ দেওয়া"],["She briefed the CEO before the board presentation.","Please brief the team on the new policy before it is announced."],"Very common in professional and management contexts","Meetings & Presentations"],["Cascade","verb",["to pass information down through an organisation"],["একটি সংস্থার মধ্য দিয়ে তথ্য নিচে পাঠানো"],["She cascaded the board decision to all line managers within twenty-four hours.","Good communication cascades quickly and accurately."],"Very common in management and communication contexts","Meetings & Presentations"],["Socialise","verb",["to share an idea informally before a formal decision"],["আনুষ্ঠানিক সিদ্ধান্তের আগে অনানুষ্ঠানিকভাবে একটি ধারণা ভাগ করা"],["She socialised the idea with key stakeholders before the board meeting.","Socialising a proposal first avoids surprises in the formal meeting."],"Very common in management and leadership discussions","Meetings & Presentations"],["Sign-off","noun",["formal approval to proceed"],["এ se check before I send it?","She ran the idea past her manager as a sense check."],"Very common in management and professional discussions","Meetings & Presentations"],["Pressure test","phrase",["to challenge an idea to find weaknesses"],["দুর্বলতা খুঁজে পেতে একটি ধারণা চ্যালেঞ্জ করা"],["We need to pressure test this plan before committing.","She pressure tested the assumptions underlying the business case."],"Common in strategy and management discussions","Meetings & Presentations"],["Talking points","phrase",["key messages prepared for a discussion"],["আলোচনার জন্য প্রস্তুত মূল বার্তা"],["She prepared her talking points before the difficult conversation.","The CEO asked for talking points for the town hall."],"Very common in communication and leadership contexts","Meetings & Presentations"],["Town hall","phrase",["a large meeting where leadership addresses all staff"],["একটি বড় বৈঠক যেখানে নেতৃত্ব সব কর্মীদের সম্বোধন করেন"],["She presented the new strategy at the quarterly town hall.","Town halls are a key tool for maintaining organisational alignment."],"Very common in corporate and management contexts","Meetings & Presentations"],["Road show","phrase",["a series of presentations to different audiences"],["বিভিন্ন দর্শকদের কাছে উপস্থাপনার একটি ধারাবাহিকতা"],["She did a road show across four cities to present the new HR strategy.","A road show builds engagement and gives people a chance to ask questions."],"Common in business and management contexts","Meetings & Presentations"],["Kickoff meeting","phrase",["the first meeting to start a project"],["একটি প্রকল্প শুরু করতে প্রথম বৈঁঠক"],["The project kickoff meeting set the tone for the whole initiative.","She ensures every project starts with a strong kickoff meeting."],"Very common in project management and business contexts","Meetings & Presentations"],["Post-mortem","phrase",["a review held after a project to learn from it"],["একটি প্রকল্পের পরে ধরে রাখা পর্যালোচনা"],["The post-mortem revealed three key lessons cument after feedback"],["প্রতিক্রিয়ার পরে একটি দলিল পুনরায় লেখা"],["She redrafted the report after receiving comments from the director.","The policy was redrafted three times before it was approved."],"Common in professional and management contexts","Written Communication"],["Circulate","verb",["to send a document to a group for comment"],["মন্তব্যের জন্য একটি দলের কাছে একটি দলিল পাঠানো"],["Please circulate the draft policy for feedback by Friday.","She circulated the minutes within twenty-four hours of the meeting."],"Very common in professional communication contexts","Written Communication"],["Correspondence","noun",["letters and emails exchanged"],["আদান-প্রদান করা চিঠি ও ইমেইল"],["All correspondence should be copied to the HR file.","She managed all correspondence with the legal team."],"Common in professional and formal contexts","Written Communication"],["Notation","noun",["a note or annotation"],["একটি নোট বা টীকা"],["She added a notation in the margin explaining her decision.","The notation in the file explained why the exception was approved."],"Common in professional and formal writing contexts","Written Communication"],["Addendum","noun",["an addition to a document"],["একটি দলিলে সংযোজন"],["She prepared an addendum to the contract with the updated terms.","The addendum was attached to the original agreement."],"Common in legal, HR, and professional writing contexts","Written Communication"],["Appendix","noun",["additional material at the end of a document"],["একটি দলিলের শেষে অতিরিক্ত উপকরণ"],["All supporting data has been included in the appendix.","Please refer to the appendix for the full statistical breakdown."],"Very common in professional and academic writing","Written Communication"],["Executive summary","phrase",["a brief overview of a longer document"],["একটি দীর্ঘ দলিলের সংক্ষিপ্ত সারসংক্ষেপ"],["The board only reads the executive summary — make it count.","She spent two hours perfecting the one-page executive summary."],"Essential in business and management writing","Written Communication"],["Scope of work","phrase",["a document defining what a project includes"],["একটি প্রকল্পে কী অন্তর্ভুক্ত তা সংজ্ঞায়িত দলিল"],["The scope of work must be agreed before work begins.","She drafted a clear scope of work for the external consultant."],"Very common in project management and business contexts","Written Communication"],["Memorandum","noun",["a written note or record for internal communication"],["অভ্যন্তরীণ যোগাযোগের জন্য লিখিত নোট বা রেকর্ড"],["She issued a memorandum to all managers about the new policy.","The decision was formalised in a memorandum to the board."],"Common in formal and corporate communication contexts","Written Communication"],["To that end","phrase",["in order to achieve that goal"],["সেই লক্ষ্য অর্জনের জন্য"],["To that end, we have allocated additional budget to the training programme.","To that end, she requested a dedicated project manager."],"Very polished and common in professional communication","Power Phrases"],["With that in mind","phrase",["keeping that consideration in our thoughts"],["সেই বিবেচনা মাথায় রেখে"],["With that in mind, I recommend we delay the launch.","With that in mind, let us revise the plan."],"Very common and polished in professional discussions","Power Phrases"],["In light of","phrase",["considering; given the context of"],["বিবেচনায় নিয়ে"],["In light of the new data, we should reconsider our approach.","In light of recent events, an update to the policy is warranted."],"Very common in formal and professional communication","Power Phrases"],["At this juncture","phrase",["at this particular point in time"],["এই বিশেষ সময়ে"],["At this juncture, it would be premature to make a final decision.","At this juncture, I recommend we pause and reassess."],"Formal and impressive in professional and leadership contexts","Power Phrases"],["On balance","phrase",["taking everything into account"],["সব কিছু বিবেচনা করলে"],["On balance, the benefits outweigh the risks." ngagement.","She identified three initiatives that would really move the needle."],"Very common in modern business and leadership English","Power Phrases"],["Raising the bar","phrase",["setting higher standards"],["উচ্চতর মান স্থাপন করা"],["She consistently raises the bar for everyone around her.","Raising the bar on quality starts with recruiting the right people."],"Very common in leadership and professional discussions","Power Phrases"],["Low-hanging fruit","phrase",["the easiest opportunities to improve"],["উন্নতির সহজতম সুযোগ"],["Let us tackle the low-hanging fruit first and build momentum.","She identified five quick wins — the low-hanging fruit of the change agenda."],"Very common in business and management discussions","Power Phrases"],["Boiling the ocean","phrase",["trying to do something impossibly large"],["অসম্ভব বড় কিছু করার চেষ্টা করা"],["Trying to solve everything at once is boiling the ocean.","We are not boiling the ocean — we are focusing on the critical twenty percent."],"Common in business and management discussions","Power Phrases"],["Double-click","phrase",["to examine something more closely"],["কোনো কিছু আরও মনোযোগ দিয়ে পরীক্ষা করা"],["Can we double-click on that point about the retention data?","She asked the team to double-click on the assumptions in the model."],"Very common in modern business and tech English","Power Phrases"],["Reach out","phrase",["to contact someone"],["কারও সাথে যোগাযোগ করা"],["Please reach out to me if you need any support.","She asked the team to reach out to all stakeholders before the announcement."],"Very common in modern professional communication","Power Phrases"],["Take offline","phrase",["to continue a discussion privately after the meeting"],["বৈঠকের পরে ব্যক্তিগতভাবে আলোচনা চালিয়ে যাওয়া"],["Let us take this offline and not use the group's time.","She took the difficult conversation offline to maintain confidentiality."],"Very common in meetings and professional discussions","Power Phrases"],["In the loop","phrase",["informed and up to date"],["অবহিত ও আপ-টু-ডেট"],["Please keep me in the loop on any developments.","She ensures all stakeholders are kept in the loop."],"Very common in professional and management communication","Power Phrases"],["On the same page","phrase",["having the same understanding"],["একই বোঝাপড়া থাকা"],["Let us make sure we are all on the same page before we proceed.","Are we on the same page about the timeline?"],"Very common in meetings and professional discussions","Power Phrases"],["Absenteeism","noun",["the practice of regularly being absent from work"],["নিয়মিতভাবে কর্মক্ষেত্রে অনুপস্থিত থাকার অভ্যাস"],["High absenteeism is often a sign of low engagement or poor culture.","She analysed absenteeism trends to identify underlying issues."],"Essential in HR and workforce management","HR Terms"],["Presenteeism","noun",["being present at work while unwell or unproductive"],["অসুস্থ বা অনুৎপাদনশীল অবস্থায় কর্মক্ষেত্রে উপস্থিত থাকা"],["Presenteeism costs businesses more than absenteeism in the long run.","She addressed presenteeism by improving the wellbeing programme."],"Common in HR and wellbeing discussions","HR Terms"],["Attrition rate","phrase",["the percentage of employees who leave in a period"],["একটি সময়কালে যে শতাংশ কর্মী চলে যান"],["Our attrition rate is fifteen percent — above the industry average.","She reduced the attrition rate by focusing on manager quality."],"Essential in HR metrics and workforce management","HR Terms"],["Engagement score","phrase",["a metric measuring employee commitment"],["কর্মী প্রতিশ্রুতি পরিমাপকারী মেট্রিক"],["The engagement score rose from 52% to 71% in two years.","She uses the quarterly engagement score to track culture health."],"Very common in HR and management discussions","HR Terms"],["Pulse survey","phrase",["a short, frequent employee survey"],["একটি সংক্ষিপ্ত, ঘন ঘন কর্মী জরিপ"],["She runs a monthly pulse survey to track engagement in real time.","Pulse surveys give faster feedback than annual engagement surveys."],"Very common in HR and employee experience","HR Terms"],["Stay interview","phrase",["a conversation to understand why employees stay"],["কর্মীরা কেন থাকেন তা বোঝার কথোপকথন"],["Stay interviews are more valuable than exit interviews.","She conducted stay interviews with every high performer."],"Common in HR and talent retention discussions","HR Terms"],["Talent review","phrase",["a formal assessment of the organisation's talent"],["সংস্থার প্রতিভার আনুষ্ঠানিক মূল্যায়ন"],["The annual talent review identifies high potential employees.","She presents talent review findings to the board every year."],"Very common in HR and leadership discussions","HR Terms"],["High potential","phrase",["an employee with the capacity for rapid advancement"],["দ্রুত অগ্রগতির ক্ষমতাসম্পন্ন কর্মী"],["She identified six high potential employees for the leadership programme.","High potential employees need challenge, exposure, and investment."],"Very common in HR and talent management","HR Terms"],["Flight risk","phrase",["an employee likely to leave the organisation"],["সংস্থা ছেড়ে যাওয়ার সম্ভাবনাসম্পন্ন কর্মী"],["She identified three flight risks and put retention plans in place.","Early identification of flight risks saves time and cost."],"Common in HR and talent retention discussions","HR Terms"],["Job analysis","phrase",["the process of studying a role in detail"],["বিস্তারিতভাবে একটি ভূমিকা অধ্যয়নের প্রক্রিয়া"],["A thorough job analysis is the foundation of good recruitment.","She conducted a job analysis before redesigning the role."],"Common in HR and job design discussions","HR Terms"],["Job evaluation","phrase",["a systematic way of determining the value of a role"],["ভূমিকার মূল্য নির্ধারণের পদ্ধতিগত উপায়"],["Job evaluation ensures pay equity across similar roles.","She implemented a formal job evaluation scheme across the organisation."],"Common in HR compensation and job design","HR Terms"],["Pay equity","phrase",["equal pay for equal or equivalent work"],["সমান বা সমমানের কাজের জন্য সমান বেতন"],["Pay equity audits should be conducted at least every two years.","She identified a pay equity gap between male and female managers."],"Very common in HR, legal, and compliance contexts","HR Terms"],["Compensation and benefits","phrase",["the total package of pay and perks"],["বেতন ও সুবিধার মোট প্যাকেজ"],["Compensation and benefits must be competitive to attract the right talent.","She oversees compensation and benefits for all three hundred employees."],"Essential in HR and management discussions","HR Terms"],["Variable pay","phrase",["pay that changes based on performance"],["কর্মক্ষমতার ভিত্তিতে পরিবর্তিত বেতন"],["Variable pay motivates performance when clearly linked to outcomes.","She restructured the variable pay scheme to make it fairer."],"Common in HR and compensation discussions","HR Terms"],["Total rewards","phrase",["everything an employee receives beyond basic salary"],["মূল বেতনের বাইরে কর্মী যা কিছু পান"],["Total rewards include salary, benefits, learning, and flexibility.","She repositioned the offer as a total rewards package."],"Common in HR and employer branding discussions","HR Terms"],["ESOP","noun",["Employee Stock Ownership Plan"],["কর্মচারী শেয়ার মালিকানা পরিকল্পনা"],["The company offered ESOPs to retain key technical talent.","She explained the financial implications of the ESOP to the candidate."],"Common in startup, tech, and HR discussions","HR Terms"],["Provident fund","phrase",["a mandatory savings scheme for employees in India"],["ভারতে কর্মীদের জন্য বাধ্যতামূলক সঞ্চয় প্রকল্প"],["All employees earning above the threshold must contribute to the provident fund.","She ensured provident fund compliance during the audit."],"Essential in Indian HR and statutory compliance","HR Terms"],["Leave encashment","phrase",["converting unused leave into cash payment"],["অব্যবহৃত ছুটিকে নগদ অর্থপ্রদানে রূপান্তর"],["Leave encashment is payable on resignation or retirement.","She calculated the leave encashment entitlement for the departing employee."],"Essential in Indian HR and compliance contexts","HR Terms"],["Flexi time","phrase",["flexible working hours"],["নমনীয় কর্মঘণ্টা"],["She introduced flexi time to improve work-life balance across the team.","Flexi time is now an expectation rather than a perk for many candidates."],"Very common in HR and workplace discussions","HR Terms"],["Hybrid policy","phrase",["a formal policy governing hybrid working"],["হাইব্রিড কর্মসংস্কৃতি পরিচালনাকারী আনুষ্ঠানিক নীতি"],["She drafted the hybrid policy after consulting all department heads.","A clear hybrid policy prevents confusion and inconsistency."],"Very common in modern HR discussions","HR Terms"],["Job share","phrase",["two people sharing one full-time role"],["দুজন লোক একটি পূর্ণকালীন ভূমিকা ভাগ করে নেওয়া"],["She introduced job share arrangements for senior roles.","Job share can be an effective retention tool for returning parents."],"Common in HR and flexible working discussions","HR Terms"],["Maternity leave","phrase",["paid leave for a parent after having a baby"],["শিশু জন্মের পর পিতামাতার জন্য বেতনসহ ছুটি"],["She ensured maternity leave compliance with all statutory requirements.","Clear maternity leave policies support working mothers significantly."],"Essential in HR and statutory compliance","HR Terms"],["Paternity leave","phrase",["leave for a father after the birth of a child"],["শিশু জন্মের পর পিতার জন্য ছুটি"],["She advocated for extended paternity leave to support gender equity.","Paternity leave uptake is a key indicator of an inclusive culture."],"Common in HR and diversity discussions","HR Terms"],["Statutory minimum","phrase",["the lowest amount required by law"],["আইন দ্বারা প্রয়োজনীয় সর্বনিম্ন পরিমাণ"],["All our policies exceed the statutory minimum requirements.","She ensured the new policy met the statutory minimum."],"Essential in HR and legal compliance","HR Terms"],["Annual leave","phrase",["paid holiday entitlement per year"],["প্রতি বছর বে function load(){try{const s=localStorage.getItem(KEY);if(s)ST=Object.assign(ST,JSON.parse(s));}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST));showToast();}catch(e){}}
function showToast(){const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400);}
function lc(){return Object.keys(ST.learned).filter(k=>ST.learned[k]).length;}

function updateStreak(){
  const today=new Date().toDateString();
  if(ST.lastStudied===today)return;
  const yest=new Date(Date.now()-86400000).toDateString();
  ST.streak=ST.lastStudied===yest?(ST.streak||0)+1:1;
  ST.lastStudied=today;
  if(!ST.studyDays)ST.studyDays=[];
  if(!ST.studyDays.includes(today))ST.studyDays.push(today);
}

function topBar(){
  const n=lc(),p=Math.round(n/TOTAL*100),left=TOTAL-n,d=Math.ceil(left/25);
  document.getElementById('pf').style.width=p+'%';
  document.getElementById('sl').textContent=n;
  document.getElementById('sr').textContent=left;
  document.getElementById('sp').textContent=p+'%';
  document.getElementById('sd').textContent=d;
  document.getElementById('sbdg').textContent='🔥 '+(ST.streak||0)+' days';
}

function go(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  if(name==='quiz')startQuiz();
  if(name==='progress')renderProg();
  window.scrollTo(0,0);
}

function fw(){return ST.activeCat==='All'?W:W.filter(w=>w[6]===ST.activeCat);}

function buildCats(){
  const c=document.getElementById('cats');c.innerHTML='';
  CATS.forEach(cat=>{
    const b=document.createElement('button');
    b.className='pill'+(cat===ST.activeCat?' active':'');
    b.textContent=cat;
    b.onclick=()=>{ST.activeCat=cat;ST.activeDay=0;buildCats();buildDayTabs();render();};
    c.appendChild(b);
  });
}

function buildDayTabs(){
  const f=fw(),batches=Math.ceil(f.length/BATCH);
  const c=document.getElementById('dtabs');c.innerHTML='';
  for(let i=0;i<batches;i++){
    const b=document.createElement('button');
    b.className='pill g'+(i===ST.activeDay?' active':'');
    b.textContent='Day '+(i+1);
    b.onclick=()=>{ST.activeDay=i;buildDayTabs();render();window.scrollTo(0,0);};
    c.appendChild(b);
  }
  setTimeout(()=>{const a=document.querySelector('#dtabs .pill.active');if(a)a.scrollIntoView({inline:'center',block:'nearest'});},50);
}

function buildMeanings(w){
  const ms=Array.isArray(w[2])?w[2]:[w[2]];
  const bns=Array.isArray(w[3])?w[3]:[w[3]];
  return ms.map((m,i)=>{
    const bn=bns[i]||bns[0]||'';
    const cls=i===0?'meaning-block':'meaning-block m2';
    const ncls=i===0?'m-bn':'m-bn m2';
    const lbl=ms.length>1?'<div class="m-num">Meaning '+(i+1)+'</div>':'';
    return '<div class="'+cls+'">'+lbl+'<div class="m-en">'+m+'</div><div class="'+ncls+'">'+bn+'</div></div>';
  }).join('');
}

function buildExamples(w){
  const exs=w[4];
  const ms=Array.isArray(w[2])?w[2]:[w[2]];
  const hasTwoMeanings=ms.length>1;
  return exs.map((ex,i)=>{
    const lbl=hasTwoMeanings?'<span class="ex-label">Eg '+(i+1)+'</span>':'<span class="ex-label">Eg</span>';
    return '<div class="ex-block">'+lbl+'<div class="ex">'+ex+'</div></div>';
  }).join('');
}

function render(){
  const q=(document.getElementById('srch').value||'').toLowerCase();
  const f=document.getElementById('flt').value;
  let items;
  if(q){
    items=W.filter(w=>{
      const ms=Array.isArray(w[2])?w[2]:[w[2]];
      const bns=Array.isArray(w[3])?w[3]:[w[3]];
      return w[0].toLowerCase().includes(q)||ms.some(m=>m.toLowerCase().includes(q))||bns.some(b=>b.includes(q));
    });
  } else {
    const base=fw(),s=ST.activeDay*BATCH,e=Math.min(s+BATCH,base.length);
    items=base.slice(s,e);
  }
  if(f==='done')items=items.filter(w=>ST.learned[W.indexOf(w)]);
  if(f==='undone')items=items.filter(w=>!ST.learned[W.indexOf(w)]);

  const out=items.map(w=>{
    const i=W.indexOf(w),done=!!ST.learned[i];
    return`<div class="card${done?' done':''}" onclick="tog(${i})">
      <div class="card-top">
        <div class="card-left">
          <div class="word">${w[0]}</div>
          <span class="wtype">${w[1]}</span><span class="wcat">${w[6]}</span>
          <div class="meanings">${buildMeanings(w)}</div>
        </div>
        <div class="tick">${done?'✓':''}</div>
      </div>
      <div class="examples">
        ${buildExamples(w)}
        ${w[5]?'<div class="tip">💡 '+w[5]+'</div>':''}
      </div>
    </div>`;
  });
  document.getElementById('wlist').innerHTML=out.length?out.join(''):'<div class="empty">No words found.</div>';
}

function tog(i){
  ST.learned[i]=!ST.learned[i];
  updateStreak();save();topBar();render();
}

// QUIZ
let quiz={words:[],idx:0,score:0,answered:false,opts:[],correct:''};

function startQuiz(){
  const pool=W.filter((_,i)=>ST.learned[i]);
  if(pool.length<4){
    document.getElementById('qwrap').innerHTML='<div class="qcard"><div class="qdone"><h2>Not enough words</h2><p>Learn at least 4 words first!</p><button class="qres" onclick="go(\'learn\')">Go Learn →</button></div></div>';
    return;
  }
  quiz.words=[...pool].sort(()=>Math.random()-0.5).slice(0,Math.min(10,pool.length));
  quiz.idx=0;quiz.score=0;quiz.answered=false;
  renderQuiz();
}

function renderQuiz(){
  if(quiz.idx>=quiz.words.length){
    const pct=Math.round(quiz.score/quiz.words.length*100),e=pct>=80?'🎉':pct>=60?'👍':'💪';
    document.getElementById('qwrap').innerHTML='<div class="qcard"><div class="qdone"><h2>'+e+' Quiz Done!</h2><p>Score: <b>'+quiz.score+'/'+quiz.words.length+'</b> ('+pct+'%)</p><button class="qres" onclick="startQuiz()">Try Again</button></div></div>';
    return;
  }
  const w=quiz.words[quiz.idx];
  const ms=Array.isArray(w[2])?w[2]:[w[2]];
  quiz.correct=ms[0]; // Use first meaning for quiz
  const pool=W.filter((_,i)=>ST.learned[i]&&W[i]!==w);
  const wrongs=[...pool].sort(()=>Math.random()-0.5).slice(0,3).map(x=>{
    const xm=Array.isArray(x[2])?x[2]:[x[2]];
    return xm[0];
  });
  quiz.opts=[quiz.correct,...wrongs].sort(()=>Math.random()-0.5);
  const btns=quiz.opts.map((o,i)=>'<button class="qopt" data-idx="'+i+'" onclick="ansQuiz(this)">'+o+'</button>').join('');
  document.getElementById('qwrap').innerHTML='<div class="qcard"><div class="qhdr"><span class="qnum">Q '+(quiz.idx+1)+'/'+quiz.words.length+'</span><span class="qscr">Score: '+quiz.score+'</span></div><div class="qq">'+w[0]+'</div><div class="qsub">What is the primary meaning of this word?</div><div class="qopts">'+btns+'</div></div>';
}

function ansQuiz(btn){
  if(quiz.answered)return;
  quiz.answered=true;
  const chosen=quiz.opts[parseInt(btn.dataset.idx)];
  document.querySelectorAll('.qopt').forEach((b,i)=>{
    if(quiz.opts[i]===quiz.correct)b.classList.add('correct');
    else if(b===btn&&chosen!==quiz.correct)b.classList.add('wrong');
    else b.classList.add('reveal');
    b.onclick=null;
  });
  if(chosen===quiz.correct)quiz.score++;
  const nxt=document.createElement('button');
  nxt.className='qnxt';
  nxt.textContent=quiz.idx+1<quiz.words.length?'Next →':'See Results';
  nxt.onclick=()=>{quiz.idx++;quiz.answered=false;renderQuiz();};
  document.querySelector('.qcard').appendChild(nxt);
}

// PROGRESS
function renderProg(){
  const n=lc(),p=Math.round(n/TOTAL*100);
  const colors=['#38bdf8','#22c55e','#f59e0b','#a78bfa','#f87171','#34d399','#fb923c','#818cf8','#4ade80','#fbbf24','#60a5fa','#f472b6','#2dd4bf','#e879f9','#94a3b8','#38bdf8','#22c55e','#f59e0b','#a78bfa','#f87171'];
  const cats=CATS.filter(c=>c!=='All').map((c,ci)=>{
    const cw=W.filter(w=>w[6]===c),cl=cw.filter(w=>ST.learned[W.indexOf(w)]).length;
    return{name:c,total:cw.length,learned:cl,pct:Math.round(cl/cw.length*100),color:colors[ci%colors.length]};
  });
  const days28=[];
  for(let i=27;i>=0;i--){const d=new Date(Date.now()-i*86400000).toDateString();days28.push({on:(ST.studyDays||[]).includes(d),today:i===0});}
  const milestones=[
    {n:50,icon:'⭐',title:'Getting Started',sub:'Learn 50 words'},
    {n:150,icon:'🔥',title:'On a Roll',sub:'Learn 150 words'},
    {n:300,icon:'💪',title:'Halfway There',sub:'Learn 300 words'},
    {n:500,icon:'🚀',title:'Advanced Learner',sub:'Learn 500 words'},
    {n:750,icon:'🏆',title:'Near the Top',sub:'Learn 750 words'},
    {n:TOTAL,icon:'👑',title:'Master Speaker',sub:'Learn all '+TOTAL+' words'}
  ];
  document.getElementById('pgwrap').innerHTML=`
    <div class="pcard"><h3>Overall Progress</h3>
      <div class="bignum">${p}%</div>
      <div class="bigsub">${n} of ${TOTAL} words learned</div>
      <div style="margin-top:10px"><div class="pb"><div class="pbf" style="width:${p}%;background:#22c55e"></div></div></div>
    </div>
    <div class="pcard"><h3>By Category</h3>
      ${cats.map(c=>`<div class="pbr"><div class="pbl"><span>${c.name}</span><span>${c.learned}/${c.total}</span></div><div class="pb"><div class="pbf" style="width:${c.pct}%;background:${c.color}"></div></div></div>`).join('')}
    </div>
    <div class="pcard"><h3>Study Activity (Last 28 Days)</h3>
      <div class="cal">${days28.map(d=>`<div class="cd${d.on?' on':''}${d.today?' today':''}"></div>`).join('')}</div>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:#64748b;margin-top:4px"><span>4w ago</span><span>3w ago</span><span>2w ago</span><span>1w ago</span><span>Today</span></div>
    </div>
    <div class="pcard"><h3>Milestones</h3>
      ${milestones.map(m=>`<div class="ms"><div class="msi">${m.icon}</div><div class="mst"><div class="mstit">${m.title}</div><div class="mssub">${m.sub}</div></div><span class="msb ${n>=m.n?'bdon':'bpnd'}">${n>=m.n?'✅ Done':(m.n-n)+' left'}</span></div>`).join('')}
    </div>
    <div class="pcard"><h3>Your Stats</h3>
      <div class="ms"><div class="msi">🔥</div><div class="mst"><div class="mstit">Current Streak</div><div class="mssub">Consecutive days</div></div><span class="msb bdon">${ST.streak||0} days</span></div>
      <div class="ms"><div class="msi">📅</div><div class="mst"><div class="mstit">Total Study Days</div><div class="mssub">Days you studied</div></div><span class="msb bdon">${(ST.studyDays||[]).length}</span></div>
      <div class="ms"><div class="msi">⏳</div><div class="mst"><div class="mstit">Days to Finish</div><div class="mssub">At 25 words per day</div></div><span class="msb bpnd">${Math.ceil((TOTAL-n)/25)} days</span></div>
    </div>`;
}

// INIT
load();buildCats();buildDayTabs();topBar();render();updateStreak();
</script>
</body>
</html>
